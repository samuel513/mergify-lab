name: queue-branch-context-probe
on:
  push:
    branches:
      - "mergify/**"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: report context
        run: |
          echo "PROBE-CONTEXT ref=$GITHUB_REF event=$GITHUB_EVENT_NAME repo=$GITHUB_REPOSITORY"
          echo "PROBE-SECRET-VISIBLE=${{ secrets.QUEUE_PROBE_SECRET != '' }}"
